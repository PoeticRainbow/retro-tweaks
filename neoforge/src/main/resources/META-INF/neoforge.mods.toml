modLoader = "javafml"
loaderVersion = "[2,)"
#issueTrackerURL = ""
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_id}"
authors = ["PoeticRainbow", "GameMasterPDX"]
description = '''${description}'''
iconFile = "assets/${mod_id}/icon.png"
bannerFile = "assets/${mod_id}/banner.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[20.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "retrotweaks-required.mixins.json"

[[mixins]]
config = "retrotweaks-tweak.mixins.json"

[[mixins]]
config = "retrotweaks-client-required.mixins.json"

[[mixins]]
config = "retrotweaks-client-tweak.mixins.json"

[[mixins]]
config = "retrotweaks-neoforge-client-tweak.mixins.json"
